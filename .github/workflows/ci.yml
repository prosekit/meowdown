name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'push' && 'push') ||
      (github.event.pull_request.stack == null && github.event.pull_request.number) ||
      (github.event.pull_request.stack != null && github.event.pull_request.stack.number)
    }}

  # Only cancel in-progress jobs for stacked PRs that are not the lowest unmerged PR or the top PR.
  # The lowest unmerged PR is the one whose base matches the stack base.
  # The top PR is the one whose position matches the stack size.
  # See: https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.stack != null &&
      github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref &&
      github.event.pull_request.stack.position != github.event.pull_request.stack.size
    }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

  test:
    runs-on: ${{ matrix.config.runner }}
    name: test-${{ matrix.config.os }}-${{ matrix.config.browser }}
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: linux
            runner: ubuntu-latest
            browser: chromium
            coverage: true
          - os: linux
            runner: ubuntu-latest
            browser: firefox
          - os: mac
            runner: macos-latest
            browser: chromium
          - os: mac
            runner: macos-latest
            browser: webkit
          - os: windows
            runner: windows-latest
            browser: chromium

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install
        run: pnpm run test:install:${{ matrix.config.browser }}

      - name: Test
        run: pnpm run test
        env:
          MEOWDOWN_TEST_BROWSER: ${{ matrix.config.browser }}
          MEOWDOWN_TEST_COVERAGE: ${{ matrix.config.coverage && 'true' || '' }}

      - name: Report Coverage
        if: ${{ !cancelled() && matrix.config.coverage && github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2

  all-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: always()
    needs: [lint, build, test]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1

  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: [build]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: Publish snapshot packages
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          max_attempts=8
          base_sleep=10
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Attempt ${attempt} to publish snapshot packages..."
            if pnpm run ci:publish:snapshot; then
              echo "Publish snapshot packages succeeded"
              break
            elif [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Publish snapshot packages failed"
              exit 1
            fi
            sleep_duration=$((base_sleep * attempt))
            echo "Sleeping ${sleep_duration}s before retry..."
            sleep "${sleep_duration}"
          done
