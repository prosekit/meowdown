name: Self Approve

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: ocavue/self-approve-action@56345538368cfbe0edcd413e5e98bace24e5133e # v1.1.1
