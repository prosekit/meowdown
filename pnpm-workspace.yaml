ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # TODO: Remove this once https://github.com/vitest-community/vitest-browser-react/pull/63 is fixed and released
    vitest-browser-react>vitest: '5'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - '@post-embed/*'
  - prosemirror-view
  - eslint-plugin-ocavue

allowBuilds:
  esbuild: false
  simple-git-hooks: false

# Development snapshots for the coordinated X archive changes. Replace with released
# versions when publishing the dependent packages.
blockExoticSubdeps: false
overrides:
  '@post-embed/types': https://pkg.pr.new/@post-embed/types@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/schema': https://pkg.pr.new/@post-embed/schema@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/exporter': https://pkg.pr.new/@post-embed/exporter@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
  '@post-embed/elements': https://pkg.pr.new/@post-embed/elements@a195e97acb1b205409cfb2333dc9dbd5c7d903ba
