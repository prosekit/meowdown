ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # TODO: Remove this once https://github.com/vitest-community/vitest-browser-react/pull/63 is fixed and released
    vitest-browser-react>vitest: '5'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - '@post-embed/*'
  - prosemirror-view
  - eslint-plugin-ocavue

allowBuilds:
  esbuild: false
  simple-git-hooks: false

# FIXME: pkg.pr.new overrides are a local testing hack. Restore the commented reference block and
# remove these (and `blockExoticSubdeps`) before merging.
blockExoticSubdeps: false
overrides:
  '@post-embed/types': https://pkg.pr.new/@post-embed/types@7bc1a3259420e2060f3183eec77557183abd7e66
  '@post-embed/schema': https://pkg.pr.new/@post-embed/schema@7bc1a3259420e2060f3183eec77557183abd7e66
  '@post-embed/exporter': https://pkg.pr.new/@post-embed/exporter@7bc1a3259420e2060f3183eec77557183abd7e66
  '@post-embed/elements': https://pkg.pr.new/@post-embed/elements@7bc1a3259420e2060f3183eec77557183abd7e66
