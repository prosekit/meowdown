ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # TODO: Remove this once https://github.com/vitest-community/vitest-browser-react/pull/63 is fixed and released
    vitest-browser-react>vitest: '5'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - '@post-embed/*'
  - prosemirror-view
  - eslint-plugin-ocavue

allowBuilds:
  esbuild: false
  simple-git-hooks: false

