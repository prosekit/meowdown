ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # TODO: Remove this once https://github.com/vitest-community/vitest-browser-react/pull/63 is fixed and released
    vitest-browser-react>vitest: '5'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - '@post-embed/*'
  - prosemirror-view
  - eslint-plugin-ocavue
  - vitest-browser-commands
  - prosemirror-flat-list

allowBuilds:
  esbuild: false
  simple-git-hooks: false
  workerd: false

# Keep these commented examples for future pkg.pr.new testing; do not remove them.
# "blockExoticSubdeps" and "overrides" install packages from pkg.pr.new
blockExoticSubdeps: false
overrides:
  '@prosekit/pm': https://pkg.pr.new/@prosekit/pm@a2e028f66ac6e33cb9eb1ccfa8afea71c0455395
  '@prosekit/react': https://pkg.pr.new/@prosekit/react@a2e028f66ac6e33cb9eb1ccfa8afea71c0455395
  '@prosekit/core': https://pkg.pr.new/@prosekit/core@a2e028f66ac6e33cb9eb1ccfa8afea71c0455395
  '@prosekit/extensions': https://pkg.pr.new/@prosekit/extensions@a2e028f66ac6e33cb9eb1ccfa8afea71c0455395
  '@prosekit/web': https://pkg.pr.new/@prosekit/web@a2e028f66ac6e33cb9eb1ccfa8afea71c0455395
#   '@post-embed/types': https://pkg.pr.new/@post-embed/types@6d2125d2b99494dc02e98eaf0878f765e62bd2a2
#   '@post-embed/schema': https://pkg.pr.new/@post-embed/schema@6d2125d2b99494dc02e98eaf0878f765e62bd2a2
#   '@post-embed/exporter': https://pkg.pr.new/@post-embed/exporter@6d2125d2b99494dc02e98eaf0878f765e62bd2a2
