ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # TODO: Remove this once https://github.com/vitest-community/vitest-browser-react/pull/63 is fixed and released
    vitest-browser-react>vitest: '5'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - '@post-embed/*'
  - prosemirror-view
  - eslint-plugin-ocavue

allowBuilds:
  esbuild: false
  simple-git-hooks: false


blockExoticSubdeps: false
overrides:
  '@post-embed/types': https://pkg.pr.new/@post-embed/types@41f4b426c813fe66763e43a3b0af9ec297287a65
  '@post-embed/schema': https://pkg.pr.new/@post-embed/schema@41f4b426c813fe66763e43a3b0af9ec297287a65
  '@post-embed/exporter': https://pkg.pr.new/@post-embed/exporter@41f4b426c813fe66763e43a3b0af9ec297287a65
  '@post-embed/elements': https://pkg.pr.new/@post-embed/elements@41f4b426c813fe66763e43a3b0af9ec297287a65
