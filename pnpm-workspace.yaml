ignoreWorkspaceRootCheck: true

packages:
  - website
  - packages/*

dedupePeers: true

strictPeerDependencies: true

# vitest-browser-react and vitest-browser-commands still declare vitest ^4 peer
# deps, but they work with the v5 beta. Allow the newer versions to satisfy them.
peerDependencyRules:
  allowedVersions:
    'vitest-browser-react>vitest': '^5.0.0-beta.7'
    'vitest-browser-commands>vitest': '^5.0.0-beta.7'
    'vitest-browser-commands>@vitest/browser-playwright': '^5.0.0-beta.7'

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080 # 7 days

trustLockfile: true

minimumReleaseAgeExclude:
  - '@ocavue/eslint-config'
  - '@prosekit/*'
  - '@aria-ui/*'
  - '@prosemirror-adapter/*'
  - prosemirror-view
  - eslint-plugin-unicorn@73.0.0

allowBuilds:
  simple-git-hooks: false

patchedDependencies:
  vitest-browser-commands@0.2.1: patches/vitest-browser-commands@0.2.1.patch
  vitest-browser-react@2.2.0: patches/vitest-browser-react@2.2.0.patch

# "blockExoticSubdeps" and "overrides" install packages from pkg.pr.new
# blockExoticSubdeps: false
# overrides:
#   '@prosekit/pm': https://pkg.pr.new/@prosekit/pm@7b1d474b13916ed1a34d54a2c9339a95d0c9be6f
#   '@prosekit/react': https://pkg.pr.new/@prosekit/react@7b1d474b13916ed1a34d54a2c9339a95d0c9be6f
#   '@prosekit/core': https://pkg.pr.new/@prosekit/core@7b1d474b13916ed1a34d54a2c9339a95d0c9be6f
#   '@prosekit/extensions': https://pkg.pr.new/@prosekit/extensions@7b1d474b13916ed1a34d54a2c9339a95d0c9be6f
#   '@prosekit/web': https://pkg.pr.new/@prosekit/web@7b1d474b13916ed1a34d54a2c9339a95d0c9be6f
